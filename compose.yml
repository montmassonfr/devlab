name: worklab

x-logging: &logging
  logging:
    driver: loki
    options: # note: the ip is the ip we will assign later to loki in this file
      loki-url: "http://172.31.254.1:3100/loki/api/v1/push"
      mode: non-blocking
      max-buffer-size: 4m
      loki-batch-size: 400
      loki-retries: "3"

x-ts-base: &ts-base
  <<: *logging
  image: tailscale/tailscale
  cap_add:
    - net_admin
    - sys_module
  depends_on:
    - headscale
  devices:
    - /dev/net/tun:/dev/net/tun
  environment:
    TS_USERSPACE: false
    TS_NO_LOGS_NO_SUPPORT: "true"
    TS_AUTHKEY: ${SERVICE_PREAUTH_KEY}
    TS_STATE_DIR: /var/lib/tailscale
    TS_EXTRA_ARGS: ${TS_EXTRA_ARGS}
  extra_hosts:
    - "${FQDN}:host-gateway"

x-ts-service: &ts-service
  <<: *ts-base
  environment:
    TS_USERSPACE: false
    TS_NO_LOGS_NO_SUPPORT: "true"
    TS_AUTHKEY: ${SERVICE_PREAUTH_KEY}
    TS_STATE_DIR: /var/lib/tailscale
    TS_EXTRA_ARGS: ${TS_EXTRA_ARGS}

services:
  # inspired from https://theorangeone.net/posts/expose-docker-internal-dns/
  coredns:
    <<: *logging
    image: coredns/coredns
    container_name: "coredns"
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./config/coredns/:/etc/coredns/
    networks:
      coredns:
      intranet:
        ipv4_address: 172.31.255.1
      # required to resolve dns query to internet domain. e.g. google.com
  step-ca:
    <<: *logging
    container_name: "step-ca"
    image: smallstep/step-ca
    restart: unless-stopped
    dns: 172.31.255.1
    ports:
      - "9000:9000"
    environment:
      - "CONFIGPATH=/config/ca.json"
    volumes:
      - "./data/step-ca/:/home/step/"
      - "./config/step-ca/:/config/"
    networks:
      intranet:
  ts-traefik:
    <<: *ts-base
    dns: 100.100.100.100
    container_name: "traefik"
    environment:
      TS_USERSPACE: false
      TS_NO_LOGS_NO_SUPPORT: "true"
      TS_AUTHKEY: ${TRAEFIK_PREAUTH_KEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-state:/var/lib/tailscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro" 
    networks:
      intranet:
        ipv4_address: 172.31.255.2
      traefik:
      homepage:

  traefik:
    <<: *logging
    image: "traefik:v3"
    restart: unless-stopped
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/config"
      - "--providers.file.watch=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.caserver=https://step-ca:9000/acme/acme/directory"
      - "--certificatesresolvers.myresolver.acme.email=postmaster@email.localhost"
      - "--certificatesresolvers.myresolver.acme.storage=/data/acme.json"
      - "--certificatesresolvers.myresolver.acme.certificatesduration=24"
      - "--serverstransport.insecureskipverify=true"
    volumes:
      - "./config/traefik/:/config/"
      - "./data/traefik/:/data/"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # TIPS: required in order to trust tls with https://step-ca:9000, must bootstrap docker host with step-ca see README.md
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro" 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.lb.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=myresolver"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
    network_mode: service:ts-traefik   # no own network — only reachable via tailnet
    depends_on:
      - ts-traefik
  headscale:
    <<: *logging
    image: headscale/headscale:0.29.2
    restart: unless-stopped
    container_name: headscale
    volumes:
      # Please set <HEADSCALE_PATH> to the absolute path
      # of the previously created headscale directory.
      - ./config/headscale:/etc/headscale:ro
      - ./data/headscale:/var/lib/headscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro" 
    ports:
      - "3478:3478/udp"
      - "9443:9443"
    command: serve
    healthcheck:
        test: ["CMD", "headscale", "health"]
        timeout: 40s
        interval: 30s
        retries: 5
        start_period: 60s
    secrets:
      - headscale_oidc_client_secret
    networks:
      - intranet

  ts-hello:
    <<: *ts-service
    hostname: hello-service
    volumes:
      - hello-state:/var/lib/tailscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro" 
    networks:
      hello:
          

  hello:
    image: traefik/whoami
    network_mode: service:ts-hello   # no own network — only reachable via tailnet
    depends_on:
      - ts-hello

  ts-mitmproxy:
    <<: *ts-service
    hostname: mitmproxy
    volumes:
      - mitmproxy-state:/var/lib/tailscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
    networks:
      mitmproxy:
      proxified:
        ipv4_address: 172.31.253.3
      external:

  ts-vaultwarden:
    <<: *ts-service
    hostname: vaultwarden
    volumes:
      - vaultwarden-state:/var/lib/tailscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
    networks:
      vaultwarden:

  ts-homepage:
    <<: *ts-service
    hostname: homepage
    volumes:
      - homepage-state:/var/lib/tailscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
    networks:
      homepage:
      prometheus:

  ts-memos:
    <<: *ts-service
    hostname: memos
    volumes:
      - memos-state:/var/lib/tailscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
    networks:
      memos:

  ts-atuin:
    <<: *ts-service
    hostname: atuin
    volumes:
      - atuin-state:/var/lib/tailscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
    networks:
      atuin:
      atuin-pg:

  ts-grafana:
    <<: *ts-service
    hostname: grafana
    volumes:
      - grafana-state:/var/lib/tailscale
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
    networks:
      grafana:
      prometheus:
      loki:

  mitmproxy:
    <<: *logging
    image: mitmproxy/mitmproxy:12
    command: mitmweb --mode ${MITM_PROXY_MODE} --web-host 0.0.0.0 --set web_password=${MITM_PASSWORD}
    container_name: "mitmproxy"
    restart: unless-stopped
    network_mode: service:ts-mitmproxy
    depends_on:
      - ts-mitmproxy
  kanidm:
    <<: *logging
    image: kanidm/server:1.11.1
    container_name: kanidm
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./config/kanidm/:/data/
      - ./data/kanidm/:/storage/
      - ./backups/kanidm/:/backups
  vaultwarden:
    <<: *logging
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vaultwarden.lb.localhost"
    volumes:
      - ./data/vaultwarden/:/data/
    network_mode: service:ts-vaultwarden
    depends_on:
      - ts-vaultwarden
  vaultwarden-backup:
    <<: *logging
    image: ttionya/vaultwarden-backup:latest
    restart: always
    environment:
       RCLONE_REMOTE_DIR: '/backups/'
       BACKUP_KEEP_DAYS: 7
    volumes:
      - ./config/vaultwarden-backup/:/config/
      - ./data/vaultwarden/:/bitwarden/data/
      - ./backups/vaultwarden:/backups
    #   - /path/to/env:/.env
  homepage:
    <<: *logging
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    container_name: homepage
    volumes:
      - ./config/homepage/:/app/config/ # Make sure your local config directory exists
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.lb.localhost # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      LOG_TARGETS: stdout
    network_mode: service:ts-homepage
    depends_on:
      - ts-homepage
  memos:
    <<: *logging
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    user: "${UID}:${GID}"
    volumes:
      - ./data/memos/:/var/opt/memos:Z
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro" 
    network_mode: service:ts-memos
    depends_on:
      - ts-memos

  memos-backup:
    <<: *logging
    image: alpine/sqlite:3.53.4
    container_name: memos-backup
    restart: unless-stopped
    volumes:
      - ./data/memos/:/data:ro
      - ./backups/memos:/backups
    environment:
      - RETENTION_DAYS=7
      - BACKUP_INTERVAL=86400
      - DB_NAME=memos_prod.db
    entrypoint: >
      sh -c "
      echo 'memos-backup sidecar started' &&
      while true; do
        ts=$$(date +%Y%m%d_%H%M%S);
        echo \"[$$ts] running backup...\";
        sqlite3 /data/$$DB_NAME \".backup /backups/memos_$${ts}.db\" &&
        echo \"[$$ts] backup OK: memos_$${ts}.db\" ||
        echo \"[$$ts] backup FAILED\";
        find /backups -name 'memos_*.db' -mtime +$$RETENTION_DAYS -delete;
        sleep $$BACKUP_INTERVAL;
      done
      "
  atuin:
    <<: *logging
    restart: unless-stopped
    image: ghcr.io/atuinsh/atuin:18.19.0
    container_name: atuin
    command: start
    volumes:
      - "./config/atuin/:/config/"
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_OPEN_REGISTRATION: "true"
      ATUIN_DB_URI: postgres://$ATUIN_DB_USERNAME:$ATUIN_DB_PASSWORD@atuin-pg/$ATUIN_DB_NAME
      RUST_LOG: info,atuin_server=debug
    depends_on:
      - atuin-pg
      - ts-atuin
    network_mode: service:ts-atuin
      
  atuin-pg:
    <<: *logging
    image: postgres:14
    container_name: atuin-pg
    restart: unless-stopped
    volumes: # Don't remove permanent storage for index database files!
      - "./data/atuin-pg/:/var/lib/postgresql/data/"
    environment:
      POSTGRES_USER: ${ATUIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${ATUIN_DB_PASSWORD}
      POSTGRES_DB: ${ATUIN_DB_NAME}
    networks:
      atuin-pg:
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes: 
      - "/:/rootfs"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/sys:/sys"
      - "/var/lib/docker/:/var/lib/docker"
      - "/dev/disk/:/dev/disk"
    privileged: true
    devices: 
      - "/dev/kmsg"
    networks:
      cadvisor:

  loki:
    <<: *logging
    container_name: loki
    hostname: loki
    restart: unless-stopped
    image: grafana/loki:latest
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      loki:
        ipv4_address: 172.31.254.1

  prometheus:
    <<: *logging
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    image: prom/prometheus:latest
    volumes: 
      - "./config/prometheus/config.yml:/etc/prometheus/prometheus.yml"
      - prom-data:/prometheus
    networks:
      prometheus:
      cadvisor:
      traefik:
      coredns:

  grafana:
    <<: *logging
    container_name: grafana
    restart: unless-stopped
    image: grafana/grafana:latest
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - DS_PROMETHEUS=prometheus
    volumes: 
      - "grafana-data:/var/lib/grafana"
      - "./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml"
    network_mode: service:ts-grafana
    depends_on:
      - ts-grafana
volumes:
  grafana-data:
  loki-data:
  prom-data:
  hello-state:
  traefik-state:
  mitmproxy-state:
  vaultwarden-state:
  homepage-state:
  memos-state:
  atuin-state:
  grafana-state:
  prometheus-state:
  loki-state:

networks:
  hello:
  atuin:
  vaultwarden:
  grafana:
  homepage:
  memos:
  atuin-pg:
    internal: true
  prometheus:
    internal: true
  mitmproxy:   
  cadvisor:
    internal: true
  loki:
    internal: true
    ipam:
      config:
        - subnet: 172.31.254.0/24
          ip_range: 172.31.254.128/25
  traefik:
  coredns:
    internal: true
  intranet:
    ipam:
      config:
        - subnet: 172.31.255.0/24
          ip_range: 172.31.255.128/25
  external:
  kanidm:
    internal: true
  headscale:
    internal: true
  proxified:
    name: proxified
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.31.253.0/24
          ip_range: 172.31.253.128/25


secrets:
  headscale_oidc_client_secret:
    environment: "HEADSCALE_OIDC_CLIENT_SECRET"