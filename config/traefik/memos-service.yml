http:
  routers:
    memos:
      rule: "Host(`memos.lb.localhost`)"
      entryPoints:
        - "websecure"
      service: memos
      tls:
        certResolver: "myresolver"

  services:
    memos:
      loadBalancer:
        servers:
          - url: "http://memos.zt.internal:5230"
        passHostHeader: true
